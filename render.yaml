# Render Blueprint —— 一键部署「个人物品库存清单 v1.3」
# 多账户各自独立 + 全网可达（任意浏览器/手机可访问，同账号跨设备同步）
# 用法：把本文件夹推到 GitHub 后，在 render.com 选 "New" → "Blueprint" → 选该仓库即可。
services:
  - type: web
    name: inventory-tracker
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev"
    startCommand: "node backend/node/server.mjs"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OWNER_USER
        value: "admin"
      # OWNER_PASS 不写在这里（用默认值 admin123）；部署后在 Render 控制台改强密码更安全
      - key: DB_DIR
        value: "/data"
    # 持久盘：免费层可能不支持；不支持时数据在「重新部署」后会被清空。
    # 用应用内「⚙ → 导出备份」随时存档兜底。要永久不丢可升级付费档或换 Railway。
    disks:
      - name: inv-data
        mountPath: "/data"
        sizeGB: 1
