server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inventory?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id        # 雪花 ID；与前端 uuid 字符串兼容（数据库用 BIGINT 或 VARCHAR 均可，本 schema 用 VARCHAR(36)）
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:change-me-in-prod-please-use-a-long-random-string}
  expiration: 604800           # 7 天（秒）

owner:
  user: ${OWNER_USER:admin}
  pass: ${OWNER_PASS:admin123}
